name: CloudStore CI Pipeline
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build and Test Java Services
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Test and build user-order-service
      run: |
        cd user-order-service
        chmod +x mvnw
        ./mvnw clean package

    - name: Test and build product-service
      run: |
        cd product-service
        chmod +x mvnw
        ./mvnw clean package

  build-frontend:
    name: Build React Frontend
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        cd frontend
        npm install

    - name: Build frontend
      run: |
        cd frontend
        npm run build

  docker-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [build-and-test, build-frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    - name: Build and push user-order-service
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/cloudstore-user-order-service:latest ./user-order-service
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloudstore-user-order-service:latest

    - name: Build and push product-service
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/cloudstore-product-service:latest ./product-service
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloudstore-product-service:latest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [docker-push]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
    - name: Deploy user-order-service to EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_USER_ORDER_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        script: |
          sudo docker pull musfikhilaly/cloudstore-user-order-service:latest
          sudo docker stop user-order-service || true
          sudo docker rm user-order-service || true
          sudo docker run -d --restart always --name user-order-service -p 8081:8082 \
            -e SPRING_DATASOURCE_URL=${{ secrets.DB_URL }} \
            -e SPRING_DATASOURCE_USERNAME=${{ secrets.DB_USERNAME }} \
            -e SPRING_DATASOURCE_PASSWORD=${{ secrets.DB_PASSWORD }} \
            musfikhilaly/cloudstore-user-order-service:latest

    - name: Deploy product-service to EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_PRODUCT_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        script: |
          sudo docker pull musfikhilaly/cloudstore-product-service:latest
          sudo docker stop product-service || true
          sudo docker rm product-service || true
          sudo docker run -d --restart always --name product-service -p 8080:8081 \
            musfikhilaly/cloudstore-product-service:latest