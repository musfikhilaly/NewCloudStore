name: CloudStore CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-backend:
    name: Build Java Services
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Build user-order-service
      run: |
        cd user-order-service
        chmod +x mvnw
        ./mvnw clean package -DskipTests
        
    - name: Build product-service
      run: |
        cd product-service
        chmod +x mvnw
        ./mvnw clean package -DskipTests

  build-frontend:
    name: Build React Frontend
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install dependencies
      run: |
        cd frontend
        npm install
        
    - name: Build frontend
      run: |
        cd frontend
        npm run build

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build user-order-service Docker image
      run: |
        docker build -t cloudstore-user-order-service ./user-order-service
        
    - name: Build product-service Docker image
      run: |
        docker build -t cloudstore-product-service ./product-service
        
    - name: Build frontend Docker image
      run: |
        docker build -t cloudstore-frontend ./frontend